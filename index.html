<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Inventario · Ferretería</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --negro: #111;
      --naranja: #f97316;
      --bg: #f5f5f5;
      --white: #fff;
      --border: #e2e2e2;
      --txl: #888;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
    body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--negro); text-transform: uppercase }

    /* HEADER */
    header {
      background: var(--negro);
      border-bottom: 3px solid var(--naranja);
      padding: 0 24px; height: 58px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .h-title { color: #fff; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 10px }
    .h-icon  { background: var(--naranja); width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px }
    .h-date  { color: #888; font-family: 'DM Mono', monospace; font-size: 11px }

    /* MAIN */
    main { padding: 20px 24px; max-width: 1100px; margin: 0 auto }

    /* KPI GRID */
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px }
    .kpi {
      background: var(--white); border: 1px solid var(--border);
      border-left: 4px solid var(--naranja);
      border-radius: 12px; padding: 16px 18px;
    }
    .kpi-val { font-family: 'DM Mono', monospace; font-size: 26px; font-weight: 700; color: var(--negro) }
    .kpi-val.ok   { color: #166534 }
    .kpi-val.warn { color: #d97706 }
    .kpi-val.bad  { color: #b91c1c }
    .kpi-lbl { font-size: 10px; font-weight: 600; color: var(--txl); letter-spacing: .5px; margin-top: 4px }

    /* TABLA */
    .card { background: var(--white); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 20px }
    .card-hdr {
      padding: 14px 18px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .card-title { font-size: 12px; font-weight: 700; color: var(--negro); letter-spacing: .4px }
    .tbl-wrap { overflow-x: auto }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px }
    thead th {
      padding: 10px 14px; text-align: left;
      font-size: 10px; font-weight: 700; letter-spacing: .5px;
      color: var(--txl); background: #fafafa;
      border-bottom: 2px solid var(--border);
    }
    tbody tr:hover { background: #fff8f4 }
    tbody td { padding: 10px 14px; border-bottom: 1px solid #f0f0f0; color: #444 }
    .mono { font-family: 'DM Mono', monospace; font-size: 11.5px }

    /* BADGES */
    .badge { padding: 2px 9px; border-radius: 20px; font-size: 10px; font-weight: 700 }
    .badge-ok   { background: #dcfce7; color: #166534 }
    .badge-warn { background: #fef3c7; color: #92400e }
    .badge-bad  { background: #fee2e2; color: #b91c1c }

    /* BTN */
    .btn {
      padding: 7px 14px; border-radius: 8px; font-family: 'Outfit', sans-serif;
      font-size: 11px; font-weight: 700; letter-spacing: .4px;
      border: none; cursor: pointer; text-transform: uppercase;
    }
    .btn-primary { background: var(--naranja); color: #fff }
    .btn-primary:hover { background: #ea6500 }

    /* SEARCH */
    .search { display: flex; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--border) }
    .search input, .search select {
      padding: 7px 12px; border: 1.5px solid var(--border); border-radius: 8px;
      font-family: 'Outfit', sans-serif; font-size: 12px; color: var(--negro);
      background: var(--white); outline: none; text-transform: uppercase;
    }
    .search input { flex: 1 }
    .search input:focus, .search select:focus { border-color: var(--naranja) }

    /* MODAL */
    .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:99; align-items:center; justify-content:center }
    .overlay.open { display:flex }
    .modal { background:#fff; border-radius:14px; padding:24px; width:420px; max-width:95vw }
    .modal h2 { font-size:14px; font-weight:700; margin-bottom:18px }
    .frow { margin-bottom:12px }
    .frow label { display:block; font-size:10px; font-weight:600; color:var(--txl); margin-bottom:4px; letter-spacing:.5px }
    .frow input, .frow select {
      width:100%; padding:8px 11px; border:1.5px solid var(--border);
      border-radius:8px; font-family:'Outfit',sans-serif; font-size:13px;
      color:var(--negro); outline:none; text-transform:uppercase;
    }
    .frow input:focus { border-color:var(--naranja) }
    .fgrid { display:grid; grid-template-columns:1fr 1fr; gap:10px }
    .mactions { display:flex; gap:10px; justify-content:flex-end; margin-top:16px }
    .btn-out { background:transparent; color:#888; border:1.5px solid var(--border); border-radius:8px; padding:7px 14px; font-family:'Outfit',sans-serif; font-size:11px; font-weight:700; cursor:pointer; text-transform:uppercase }
  </style>
</head>
<body>

<header>
  <div class="h-title">
    <div class="h-icon">🔧</div>
    Ferretería · Inventario
  </div>
  <div class="h-date" id="hdr-fecha"></div>
</header>

<main>

  <!-- KPIs -->
  <div class="kpis">
    <div class="kpi">
      <div class="kpi-val" id="kv-total">0</div>
      <div class="kpi-lbl">Total Productos</div>
    </div>
    <div class="kpi" style="border-left-color:#166534">
      <div class="kpi-val ok" id="kv-ok">0</div>
      <div class="kpi-lbl">Stock Normal</div>
    </div>
    <div class="kpi" style="border-left-color:#d97706">
      <div class="kpi-val warn" id="kv-warn">0</div>
      <div class="kpi-lbl">Stock Bajo</div>
    </div>
    <div class="kpi" style="border-left-color:#b91c1c">
      <div class="kpi-val bad" id="kv-agot">0</div>
      <div class="kpi-lbl">Agotados</div>
    </div>
  </div>

  <!-- TABLA -->
  <div class="card">
    <div class="card-hdr">
      <div class="card-title">📦 Listado de Productos</div>
      <button class="btn btn-primary" onclick="abrirModal()">+ Agregar</button>
    </div>
    <div class="search">
      <input id="srch" placeholder="Buscar producto o código..." oninput="render()">
      <select id="fil-cat" onchange="render()"><option value="">Todas las categorías</option></select>
      <select id="fil-est" onchange="render()">
        <option value="">Todos</option>
        <option value="ok">Normal</option>
        <option value="warn">Stock Bajo</option>
        <option value="bad">Agotado</option>
      </select>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th><th>Código</th><th>Producto</th><th>Categoría</th>
            <th>Stock</th><th>Mínimo</th><th>Estado</th><th>Precio</th><th></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

</main>

<!-- MODAL -->
<div class="overlay" id="overlay" onclick="cerrar(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <h2 id="m-title">Agregar Producto</h2>
    <div class="frow">
      <label>Nombre del Producto</label>
      <input id="f-nombre" placeholder="Ej: Martillo 16oz">
    </div>
    <div class="fgrid">
      <div class="frow"><label>Código</label><input id="f-cod" placeholder="FER-001"></div>
      <div class="frow"><label>Categoría</label><input id="f-cat" placeholder="Herramientas"></div>
    </div>
    <div class="fgrid">
      <div class="frow"><label>Stock Actual</label><input id="f-stock" type="number" min="0" placeholder="0"></div>
      <div class="frow"><label>Stock Mínimo</label><input id="f-min" type="number" min="0" placeholder="5"></div>
    </div>
    <div class="frow">
      <label>Precio ($)</label>
      <input id="f-precio" type="number" min="0" placeholder="0">
    </div>
    <div class="mactions">
      <button class="btn-out" onclick="document.getElementById('overlay').classList.remove('open')">Cancelar</button>
      <button class="btn btn-primary" onclick="guardar()">Guardar</button>
    </div>
  </div>
</div>

<script>
let items = [
  { id:1, cod:'HER-001', nombre:'Martillo Carpintero 16oz',   cat:'Herramientas', stock:45, min:10, precio:32000 },
  { id:2, cod:'HER-002', nombre:'Destornillador Phillips #2', cat:'Herramientas', stock:8,  min:15, precio:12000 },
  { id:3, cod:'ELE-001', nombre:'Cable THW 12 AWG (metro)',   cat:'Eléctrico',    stock:0,  min:30, precio:4500  },
  { id:4, cod:'ELE-002', nombre:'Toma Corriente Doble',       cat:'Eléctrico',    stock:6,  min:20, precio:8500  },
  { id:5, cod:'PLO-001', nombre:'Tubo PVC 1/2" x 6m',        cat:'Plomería',     stock:0,  min:15, precio:18000 },
  { id:6, cod:'PLO-002', nombre:'Llave de Paso 1/2"',        cat:'Plomería',     stock:4,  min:10, precio:15000 },
  { id:7, cod:'PIN-001', nombre:'Pintura Vinilo Blanco 4L',   cat:'Pintura',      stock:22, min:8,  precio:45000 },
  { id:8, cod:'FIJ-001', nombre:'Tornillo Drywall 6x1 (100u)',cat:'Fijaciones',   stock:85, min:20, precio:6500  },
];
let editId = null;

const estado = p => p.stock === 0 ? 'bad' : p.stock < p.min ? 'warn' : 'ok';

function renderKPIs() {
  document.getElementById('kv-total').textContent = items.length;
  document.getElementById('kv-ok').textContent    = items.filter(p=>estado(p)==='ok').length;
  document.getElementById('kv-warn').textContent  = items.filter(p=>estado(p)==='warn').length;
  document.getElementById('kv-agot').textContent  = items.filter(p=>estado(p)==='bad').length;
}

function render() {
  // Categorías
  const sel = document.getElementById('fil-cat');
  const cur = sel.value;
  const cats = [...new Set(items.map(p=>p.cat))].sort();
  sel.innerHTML = '<option value="">Todas las categorías</option>' +
    cats.map(c=>`<option${c===cur?' selected':''}>${c}</option>`).join('');

  const srch = document.getElementById('srch').value.toLowerCase();
  const cat  = document.getElementById('fil-cat').value;
  const est  = document.getElementById('fil-est').value;

  let lista = items;
  if (srch) lista = lista.filter(p => p.nombre.toLowerCase().includes(srch) || p.cod.toLowerCase().includes(srch));
  if (cat)  lista = lista.filter(p => p.cat === cat);
  if (est)  lista = lista.filter(p => estado(p) === est);

  const badgeTxt = { ok:'Normal', warn:'Bajo', bad:'Agotado' };
  document.getElementById('tbody').innerHTML = lista.map((p,i) => {
    const st = estado(p);
    return `<tr>
      <td class="mono" style="color:#aaa">${i+1}</td>
      <td class="mono" style="color:#f97316;font-weight:600">${p.cod}</td>
      <td style="font-weight:600;color:#111">${p.nombre}</td>
      <td style="font-size:11.5px">${p.cat}</td>
      <td class="mono" style="font-weight:700;color:${st==='bad'?'#b91c1c':st==='warn'?'#d97706':'#166534'}">${p.stock}</td>
      <td class="mono">${p.min}</td>
      <td><span class="badge badge-${st}">${badgeTxt[st]}</span></td>
      <td class="mono">$${p.precio.toLocaleString('es-CO')}</td>
      <td><button onclick="editar(${p.id})" style="background:none;border:1.5px solid #e2e2e2;border-radius:6px;padding:3px 8px;cursor:pointer;font-size:12px" title="Editar">✏</button></td>
    </tr>`;
  }).join('');

  renderKPIs();
}

function abrirModal(p) {
  editId = null;
  document.getElementById('m-title').textContent = 'Agregar Producto';
  ['f-nombre','f-cod','f-cat','f-stock','f-min','f-precio'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('overlay').classList.add('open');
}

function editar(id) {
  const p = items.find(x=>x.id===id); if(!p) return;
  editId = id;
  document.getElementById('m-title').textContent = 'Editar Producto';
  document.getElementById('f-nombre').value = p.nombre;
  document.getElementById('f-cod').value    = p.cod;
  document.getElementById('f-cat').value    = p.cat;
  document.getElementById('f-stock').value  = p.stock;
  document.getElementById('f-min').value    = p.min;
  document.getElementById('f-precio').value = p.precio;
  document.getElementById('overlay').classList.add('open');
}

function guardar() {
  const nombre = document.getElementById('f-nombre').value.trim();
  const cod    = document.getElementById('f-cod').value.trim();
  const cat    = document.getElementById('f-cat').value.trim();
  const stock  = parseInt(document.getElementById('f-stock').value)||0;
  const min    = parseInt(document.getElementById('f-min').value)||0;
  const precio = parseInt(document.getElementById('f-precio').value)||0;
  if (!nombre || !cod) { alert('Completa Nombre y Código'); return; }
  if (editId !== null) {
    const i = items.findIndex(p=>p.id===editId);
    items[i] = { id:editId, cod, nombre, cat, stock, min, precio };
  } else {
    items.push({ id: Date.now(), cod, nombre, cat, stock, min, precio });
  }
  document.getElementById('overlay').classList.remove('open');
  render();
}

function cerrar(e) { if(e.target.id==='overlay') document.getElementById('overlay').classList.remove('open') }

// Fecha
document.getElementById('hdr-fecha').textContent = new Date().toLocaleDateString('es-CO',{day:'2-digit',month:'2-digit',year:'numeric'});
render();
</script>
</body>
</html>
